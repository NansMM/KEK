# Publie une release de KEK à chaque étiquette « vX.Y.Z » (voir tools/release.py).
# WowUp lit release.json pour proposer la mise à jour aux joueurs de WoW Forever.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Banc de test (rien n'est publié s'il échoue)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pip install lupa==2.8
          python tools/test/run_tests.py

      - name: Paquet (zip, release.json, notes)
        run: python tools/package.py "${GITHUB_REF_NAME#v}"

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/release.json \
            --title "KEK ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md
